[project]
name = "receiving-manager"
version = "0.1.0"
description = "AI-powered Receiving Manager: inspects inbound shipment photos against purchase orders and produces evidence-backed decisions."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.6.9", "pillow==12.3.0"]

[project.scripts]
receiving-manager = "receiving_manager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["receiving_manager*"]

[tool.setuptools.package-data]
receiving_manager = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
